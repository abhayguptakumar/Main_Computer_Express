<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Payment | Computer Express</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><span class="eyebrow">PAYMENT</span><h1>Choose payment method</h1><p>Demo payment screen for Form 1. No real money is charged.</p></section><section class="panel glass" style="max-width:720px;margin:auto"><div class="notice">Demo mode: payment gateway will be connected in the backend phase.</div><label style="display:block;margin:12px 0"><input type="radio" name="pay" checked> Cash on Delivery</label><label style="display:block;margin:12px 0"><input type="radio" name="pay"> UPI / Card / Net Banking (Demo)</label><button id="place-order" class="btn btn-primary" style="width:100%;margin-top:20px">Place Demo Order</button></section></main><div id="site-footer"></div><script src="../js/products.js"></script><script src="../js/main.js"></script><script>document.addEventListener("DOMContentLoaded",()=>document.getElementById("place-order").onclick=()=>{const cart=JSON.parse(localStorage.getItem("computerExpressCart")||"[]");const products=window.PRODUCTS||[];const user=JSON.parse(localStorage.getItem("computerExpressUser")||"null");const items=cart.map(i=>{const p=products.find(x=>x.id===i.id);return p?{id:p.id,name:p.name,qty:i.qty,price:p.price}:null}).filter(Boolean);const total=items.reduce((n,i)=>n+i.price*i.qty,0);const orderId="CE"+Date.now().toString().slice(-6);localStorage.setItem("lastOrder",orderId);if(user){const orders=JSON.parse(localStorage.getItem("computerExpressOrders")||"[]");orders.unshift({orderId,email:user.email,items,total,status:"Placed",createdAt:new Date().toISOString()});localStorage.setItem("computerExpressOrders",JSON.stringify(orders));}localStorage.removeItem("computerExpressCart");location.href="order-confirmation.html"});</script></body></html>
