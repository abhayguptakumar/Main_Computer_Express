<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login / Register | Computer Express</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="form2.css"></head><body><div id="form2-header"></div><main class="form2-wrap"><section class="f2-hero"><span class="f2-kicker">USER ACCOUNT</span><h1>Login or create your account.</h1><p>Your account will be used for orders, service bookings and profile settings.</p></section><div id="auth-message" class="form-message" hidden></div><div class="auth-grid"><form id="login-form" class="auth-panel glass"><h2>Login</h2><p>Already have an account? Continue to your dashboard.</p><div class="field"><label>Email</label><input name="email" class="input" type="email" required></div><div class="field"><label>Password</label><input name="password" class="input" type="password" required></div><button class="btn btn-primary" style="width:100%">Login</button></form><form id="register-form" class="auth-panel glass"><h2>Create Account</h2><p>New here? Register once and manage everything from your dashboard.</p><div class="field"><label>Full Name</label><input name="name" class="input" required></div><div class="field"><label>Email</label><input name="email" class="input" type="email" required></div><div class="field"><label>Phone</label><input name="phone" class="input" type="tel" required></div><div class="field"><label>Password</label><input name="password" class="input" type="password" minlength="6" required></div><div class="field"><label>Confirm Password</label><input name="confirmPassword" class="input" type="password" minlength="6" required></div><button class="btn btn-primary" style="width:100%">Create Account</button></form></div></main><script src="../js/products.js"></script><script src="../js/main.js"></script><script src="form2.js"></script></body></html>
